name: Build and Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '重建并发布已有标签（留空只构建当前分支）'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            target: windows/amd64
          - platform: macos
            os: macos-latest
            target: darwin/universal
          - platform: linux
            os: ubuntu-latest
            target: linux/amd64

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            packages/ui/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg rpm zstd

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix packages/ui

      - name: Run regression checks
        run: npm run check

      - name: Build and package
        run: npx mygo build -platform ${{ matrix.target }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.platform }}-artifacts
          if-no-files-found: error
          retention-days: 14
          path: |
            dist-mygo/**/*.exe
            dist-mygo/**/*.msi
            dist-mygo/**/*.zip
            dist-mygo/**/*.dmg
            dist-mygo/**/*.tar.gz
            dist-mygo/**/*.deb
            dist-mygo/**/*.rpm
            dist-mygo/**/*.pkg.tar.zst

  release:
    name: Publish release
    needs: build
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.release_tag, 'v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Prepare Chinese release notes
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          node scripts/release-notes.mjs "$version" release-notes.md

      - name: Download artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lh artifacts

      # GitHub 上传时会将文件名空格改成点；校验清单必须使用最终下载文件名。
      - name: Normalize release filenames
        shell: bash
        run: |
          node -e 'const fs = require("node:fs"); for (const file of fs.readdirSync("artifacts")) { const name = file.replace(/ /g, "."); if (name !== file) fs.renameSync("artifacts/" + file, "artifacts/" + name); }'

      - name: Generate checksums
        shell: bash
        run: |
          cd artifacts
          find . -maxdepth 1 -type f \( -name '*.exe' -o -name '*.zip' -o -name '*.dmg' -o -name '*.tar.gz' -o -name '*.deb' -o -name '*.rpm' -o -name '*.pkg.tar.zst' \) -printf '%f\0' | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: |
            artifacts/SHA256SUMS.txt
            artifacts/*.exe
            artifacts/*.zip
            artifacts/*.dmg
            artifacts/*.tar.gz
            artifacts/*.deb
            artifacts/*.rpm
            artifacts/*.pkg.tar.zst
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: Pi Desktop ${{ inputs.release_tag || github.ref_name }}
          body_path: release-notes.md
          draft: false
          prerelease: false
