name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            builder_args: --win
          - platform: macos
            os: macos-latest
            builder_args: --mac
          - platform: linux
            os: ubuntu-latest
            builder_args: --linux

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            packages/ui/package-lock.json

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 build-essential python3

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix packages/ui

      - name: Run regression checks
        run: npm run check

      - name: Build app
        run: npm run build

      - name: Package app
        run: npx --no-install electron-builder ${{ matrix.builder_args }} --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-artifacts
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/*.exe
            dist/*.msi
            dist/*.zip
            dist/*.dmg
            dist/*.AppImage
            dist/*.tar.gz
            dist/*.blockmap

  release:
    name: Publish release
    needs: build
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lh artifacts

      - name: Generate checksums
        shell: bash
        run: |
          cd artifacts
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\0' | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/SHA256SUMS.txt
            artifacts/*.exe
            artifacts/*.zip
            artifacts/*.dmg
            artifacts/*.AppImage
            artifacts/*.tar.gz
          draft: false
          prerelease: false
          generate_release_notes: true
