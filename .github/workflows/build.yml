name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: '重建并发布已有标签（留空只构建当前分支）'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            builder_args: --win
          - platform: macos
            os: macos-latest
            builder_args: --mac
          - platform: linux
            os: ubuntu-latest
            builder_args: --linux

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            packages/ui/package-lock.json

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 build-essential python3

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix packages/ui

      # 桌面端会话跑的是本机 pi（不内置）：`npm run check` 里的 host 检查与冒烟都要真起进程
      - name: Install Pi CLI
        run: npm install -g @earendil-works/pi-coding-agent@1.2.0

      - name: Prepare POSIX PTY helper permissions
        if: runner.os != 'Windows'
        shell: bash
        run: find node_modules/node-pty -type f -name spawn-helper -exec chmod +x {} \;

      - name: Run regression checks
        run: npm run check

      - name: Build app
        run: npm run build

      - name: Run Electron smoke checks
        if: runner.os == 'Windows'
        shell: bash
        run: npx --no-install electron scripts/checks/smoke.electron.mjs

      - name: Package app
        run: npx --no-install electron-builder ${{ matrix.builder_args }} --publish never

      - name: Verify packaged PTY
        if: runner.os == 'Windows'
        run: npx --no-install electron scripts/checks/packaged-pty.electron.mjs dist/win-unpacked/resources/app.asar

      - name: Upload artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.platform }}-artifacts
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/*.exe
            dist/*.msi
            dist/*.zip
            dist/*.dmg
            dist/*.AppImage
            dist/*.tar.gz
            dist/*.blockmap

  release:
    name: Publish release
    needs: build
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.release_tag, 'v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Prepare Chinese release notes
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          node scripts/release-notes.mjs "$version" release-notes.md

      - name: Download artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lh artifacts

      # GitHub 上传时会将文件名空格改成点；校验清单必须使用最终下载文件名。
      - name: Normalize release filenames
        shell: bash
        run: |
          node -e 'const fs = require("node:fs"); for (const file of fs.readdirSync("artifacts")) { const name = file.replace(/ /g, "."); if (name !== file) fs.renameSync("artifacts/" + file, "artifacts/" + name); }'

      - name: Generate checksums
        shell: bash
        run: |
          cd artifacts
          find . -maxdepth 1 -type f \( -name '*.exe' -o -name '*.zip' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.tar.gz' \) -printf '%f\0' | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: |
            artifacts/SHA256SUMS.txt
            artifacts/*.exe
            artifacts/*.zip
            artifacts/*.dmg
            artifacts/*.AppImage
            artifacts/*.tar.gz
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: Pi Desktop ${{ inputs.release_tag || github.ref_name }}
          body_path: release-notes.md
          draft: false
          prerelease: false
