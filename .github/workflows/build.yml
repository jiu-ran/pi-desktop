name: Build and Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '重建并发布已有标签（留空只构建当前分支）'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            target: windows/amd64
          - platform: macos
            os: macos-latest
            target: darwin/universal
          - platform: linux
            os: ubuntu-latest
            target: linux/amd64

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            packages/ui/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg rpm zstd

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix packages/ui

      - name: Run regression checks
        run: npm run check

      # 只有 Linux 上 cgo / gcc 一定可用，-race 在这里跑才有意义
      - name: Race tests (host)
        if: runner.os == 'Linux'
        run: go test -race ./internal/host

      # 更新包签名公钥：没有 secret 时照样能构建，但客户端只允许「到发布页手动下载」。
      - name: Inject update signing public key
        shell: bash
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            echo "::warning::没有配置 UPDATE_SIGNING_KEY，本次构建不会内置更新签名公钥，客户端只能手动下载更新"
          else
            node scripts/gen-update-key.mjs emit-go internal/host/update_key_generated.go
          fi

      - name: Build and package
        run: npx mygo build -platform ${{ matrix.target }}

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.platform }}-artifacts
          if-no-files-found: error
          retention-days: 14
          path: |
            dist-mygo/**/*.exe
            dist-mygo/**/*.msi
            dist-mygo/**/*.zip
            dist-mygo/**/*.dmg
            dist-mygo/**/*.tar.gz
            dist-mygo/**/*.deb
            dist-mygo/**/*.rpm

  release:
    name: Publish release
    needs: build
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.release_tag, 'v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Prepare Chinese release notes
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          node scripts/release-notes.mjs "$version" release-notes.md

      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lh artifacts

      # download-artifact 会保留每个 artifact 内部的目录层级（windows-amd64/…），
      # 而校验与上传都只看 artifacts/ 根目录，不摊平就会生成一份空的 SHA256SUMS 并上传 0 个文件
      # （v0.9.0 首次发布就踩了这个坑）。
      - name: Flatten artifacts
        shell: bash
        run: |
          cd artifacts
          find . -mindepth 2 -type f -exec mv -f {} . \;
          find . -mindepth 1 -type d -exec rm -rf {} +
          ls -lh

      # GitHub 上传时会将文件名空格改成点；校验清单必须使用最终下载文件名。
      - name: Normalize release filenames
        shell: bash
        run: |
          node -e 'const fs = require("node:fs"); for (const file of fs.readdirSync("artifacts")) { const name = file.replace(/ /g, "."); if (name !== file) fs.renameSync("artifacts/" + file, "artifacts/" + name); }'

      - name: Generate checksums
        shell: bash
        run: |
          cd artifacts
          find . -maxdepth 1 -type f \( -name '*.exe' -o -name '*.zip' -o -name '*.dmg' -o -name '*.tar.gz' -o -name '*.deb' -o -name '*.rpm' \) -printf '%f\0' | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # 用 ed25519 给校验清单签名：客户端只信任验过签的包（见 internal/host/update_key.go）。
      - name: Sign checksums
        shell: bash
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            echo "::warning::没有配置 UPDATE_SIGNING_KEY，发布件将不带 SHA256SUMS.txt.sig（客户端不会自动安装）"
          else
            node scripts/gen-update-key.mjs sign artifacts/SHA256SUMS.txt
          fi

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            artifacts/SHA256SUMS.txt
            artifacts/SHA256SUMS.txt.sig
            artifacts/*.exe
            artifacts/*.zip
            artifacts/*.dmg
            artifacts/*.tar.gz
            artifacts/*.deb
            artifacts/*.rpm
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: Pi Desktop ${{ inputs.release_tag || github.ref_name }}
          body_path: release-notes.md
          draft: false
          prerelease: false
