name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows 构建
          - os: windows-latest
            platform: win
            artifact_path: 'dist/Pi Desktop Setup*.exe'

          # macOS Apple Silicon 构建
          - os: macos-latest
            platform: mac-arm64
            artifact_path: 'dist/Pi.Desktop*.dmg'

          # Linux 构建
          - os: ubuntu-latest
            platform: linux
            artifact_path: 'dist/Pi.Desktop*.AppImage'

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Python (macOS/Linux)
        if: runner.os != 'Windows'
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          npm install
          npm install --prefix packages/ui

      - name: Build UI
        run: npm run build

      - name: Build Electron
        run: npm run build:electron

      - name: Build and package (Windows)
        if: runner.os == 'Windows'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --win --publish never

      - name: Build and package (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: -
        run: npx electron-builder --mac --publish never

      - name: Build and package (Linux)
        if: runner.os == 'Linux'
        run: npx electron-builder --linux --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-artifacts
          path: |
            dist/Pi*.exe
            dist/Pi*.msi
            dist/Pi*.zip
            dist/Pi*.dmg
            dist/Pi*.AppImage
            dist/pi-desktop*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        shell: bash
        run: |
          mkdir -p final_artifacts
          find artifacts -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.zip" -o -name "*.AppImage" -o -name "*.tar.gz" -o -name "*.msi" \) -exec cp {} final_artifacts/ \;
          ls -lh final_artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: final_artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true
