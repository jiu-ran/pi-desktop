name: Build AppImage (Linux)

on:
  push:
    tags:
      - 'v*'

jobs:
  build-appimage:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 libfuse2

      - name: Install npm dependencies
        run: |
          npm install
          npm install --prefix packages/ui

      - name: Build UI
        run: npm run build

      - name: Build Electron
        run: npm run build:electron

      - name: Build AppImage
        run: npx electron-builder --linux AppImage --publish never

      - name: Generate tar.gz
        run: npx electron-builder --linux tar.gz --publish never

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: |
            dist/Pi.Desktop*.AppImage
            dist/pi-desktop*.tar.gz
          retention-days: 7
