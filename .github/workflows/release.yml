name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm install
          npm install --prefix packages/ui

      - name: Build UI
        run: npm run build

      - name: Package Electron app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx --yes electron-builder --${{ matrix.platform }} --publish never

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.1.4' }}
          name: Pi Desktop ${{ github.ref_type == 'tag' && github.ref_name || 'v0.1.4' }}
          draft: false
          prerelease: false
          generate_release_notes: false
          body: |
            Pi Desktop：基于本机 Pi Coding Agent CLI 的跨平台桌面工作台（Electron + Vue 3 + TypeScript）。

            - 对话代码块和 Markdown 源码支持语法高亮
            - 软件更新支持检查、下载、准备，并在确认后安装并重启
            - 完善设置界面、应用图标和插件信息展示

            前置条件：本机已安装并可在命令行运行 `pi`。
          files: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/*.AppImage
            dist/*.tar.gz
