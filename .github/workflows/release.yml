name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm install
          npm install --prefix packages/ui

      - name: Build UI
        run: npm run build

      - name: Package Electron app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx --yes electron-builder --${{ matrix.platform }} --publish never

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.1.1' }}
          name: Pi Desktop ${{ github.ref_type == 'tag' && github.ref_name || 'v0.1.1' }}
          draft: false
          prerelease: false
          generate_release_notes: false
          body: |
            Pi Desktop v0.1.1：基于本机 Pi Coding Agent CLI 的跨平台桌面工作台（Electron + Vue 3 + TypeScript）。

            - Pi 只从系统 PATH 识别，跳过项目内 shim；识别失败可手动指定路径
            - 更新改由识别到的 Pi 执行 `pi update` 或 `pi update --all`，适配 npm、pnpm 与官方安装器
            - 有新版本时在标题栏提示；自动更新沿用所选范围
            - 设置弹窗增加打开与关闭动画，仅点击关闭按钮关闭
            - Mermaid 主题改为渲染时初始化，不再往图表源码注入配置
            - 窄窗口下对话、输入框、设置页、侧栏与标题栏的布局收紧

            前置条件：本机已安装并可在命令行运行 `pi`。
          files: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/*.AppImage
            dist/*.tar.gz
