name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm install
          npm install --prefix packages/ui

      - name: Build UI
        run: npm run build

      - name: Package Electron app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx --yes electron-builder --${{ matrix.platform }} --publish never

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.1.2' }}
          name: Pi Desktop ${{ github.ref_type == 'tag' && github.ref_name || 'v0.1.2' }}
          draft: false
          prerelease: false
          generate_release_notes: false
          body: |
            Pi Desktop v0.1.2：基于本机 Pi Coding Agent CLI 的跨平台桌面工作台（Electron + Vue 3 + TypeScript）。

            - Mermaid 流程图改用 elk 自绘，支持圆角节点、连线标签、拖拽与缩放
            - 图表默认缩放调整为适合阅读的尺寸，并按该尺寸显示为 100%
            - 全屏按钮改为图标，全屏层避开窗口的最小化、最大化与关闭按钮

            前置条件：本机已安装并可在命令行运行 `pi`。
          files: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/*.AppImage
            dist/*.tar.gz
