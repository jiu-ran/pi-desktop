<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 900" font-family="Inter, Microsoft YaHei UI, Segoe UI, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6b6c70"/>
    </marker>
  </defs>
  <rect width="1320" height="900" fill="#090909"/>

  <!-- title -->
  <text x="40" y="48" fill="#e0e1e4" font-size="22" font-weight="650">Pi Desktop 的模块边界</text>
  <text x="40" y="72" fill="#909192" font-size="13">四条边界：进程 · 工作台 · 插件 · 内核上下文。颜色代表区域，位置对应界面上的职责。</text>

  <!-- ===================== window ===================== -->
  <rect x="40" y="100" width="840" height="470" rx="14" fill="#111214" stroke="#2a2b2f"/>
  <!-- titlebar -->
  <rect x="40" y="100" width="840" height="40" rx="14" fill="#0c0d0e"/>
  <rect x="40" y="126" width="840" height="14" fill="#0c0d0e"/>
  <circle cx="64" cy="120" r="5.5" fill="#e5534b"/>
  <circle cx="84" cy="120" r="5.5" fill="#e5a23d"/>
  <circle cx="104" cy="120" r="5.5" fill="#169068"/>
  <text x="128" y="125" fill="#6b6c70" font-size="13" font-weight="650">π</text>
  <rect x="150" y="110" width="26" height="20" rx="5" fill="#25262a"/>
  <text x="158" y="124" fill="#909192" font-size="11">◫</text>
  <!-- breadcrumb (conversation) -->
  <rect x="184" y="110" width="150" height="20" rx="5" fill="#2a7deb" fill-opacity="0.18" stroke="#2a7deb" stroke-opacity="0.6"/>
  <text x="196" y="124" fill="#9ec4ff" font-size="11">titlebar · 面包屑</text>
  <!-- statusbar (status) -->
  <rect x="676" y="110" width="164" height="20" rx="5" fill="#169068" fill-opacity="0.16" stroke="#169068" stroke-opacity="0.6"/>
  <text x="688" y="124" fill="#7ddec0" font-size="11">statusbar · 连接 / 用量</text>

  <!-- sidebar island (workspace and sessions) -->
  <rect x="56" y="156" width="176" height="398" rx="10" fill="#e5a23d" fill-opacity="0.10" stroke="#e5a23d" stroke-opacity="0.65"/>
  <text x="70" y="178" fill="#f0c27a" font-size="11" font-weight="650">项目与会话栏</text>
  <text x="70" y="196" fill="#6b6c70" font-size="10">工作区 · 会话 · 新建任务</text>
  <rect x="70" y="210" width="148" height="26" rx="6" fill="#e5a23d" fill-opacity="0.22"/>
  <text x="82" y="227" fill="#f0c27a" font-size="11">＋ 新建任务</text>
  <text x="82" y="256" fill="#909192" font-size="11">pi-desktop</text>
  <rect x="70" y="266" width="148" height="22" rx="5" fill="#ffffff" fill-opacity="0.06"/>
  <text x="82" y="281" fill="#e0e1e4" font-size="11">● 重构模块边界</text>
  <text x="82" y="306" fill="#909192" font-size="11">○ 补齐类型契约</text>
  <text x="82" y="328" fill="#909192" font-size="11">○ 样式归属插件</text>
  <text x="70" y="360" fill="#6b6c70" font-size="10">另一个项目</text>
  <text x="82" y="382" fill="#909192" font-size="11">○ 修复会话切换</text>
  <text x="70" y="534" fill="#6b6c70" font-size="10">停用扩展插件 → 面板与标签关闭</text>

  <!-- stage island -->
  <rect x="244" y="156" width="292" height="398" rx="10" fill="#18191b" stroke="#2a2b2f"/>
  <text x="258" y="178" fill="#6b6c70" font-size="11" font-weight="650">对话区 · AgentChat</text>
  <!-- user message -->
  <rect x="312" y="194" width="208" height="30" rx="8" fill="#303133"/>
  <text x="326" y="213" fill="#e0e1e4" font-size="11">把模块边界画出来</text>
  <!-- thinking block (chat component) -->
  <rect x="258" y="234" width="264" height="24" rx="6" fill="#a07be0" fill-opacity="0.14" stroke="#a07be0" stroke-opacity="0.5"/>
  <text x="270" y="250" fill="#c9b6f2" font-size="11">components/chat · 思考块</text>
  <!-- assistant text (markdown component) -->
  <rect x="258" y="266" width="264" height="44" rx="6" fill="#2a7deb" fill-opacity="0.12" stroke="#2a7deb" stroke-opacity="0.5"/>
  <text x="270" y="284" fill="#9ec4ff" font-size="11">components/chat · 助手文本</text>
  <text x="270" y="300" fill="#6b6c70" font-size="10">流式 Markdown · markdown 插件</text>
  <!-- tool card (chat tools) -->
  <rect x="258" y="318" width="264" height="44" rx="6" fill="#df8538" fill-opacity="0.13" stroke="#df8538" stroke-opacity="0.55"/>
  <text x="270" y="336" fill="#f0b27a" font-size="11">components/chat/tools · diff 卡片</text>
  <text x="270" y="352" fill="#6b6c70" font-size="10">bash / read / 通用工具卡片</text>
  <!-- timeline footer (changes) -->
  <rect x="258" y="372" width="264" height="24" rx="6" fill="#3fc28f" fill-opacity="0.13" stroke="#3fc28f" stroke-opacity="0.55"/>
  <text x="270" y="388" fill="#8fe0c0" font-size="11">timeline.footer · 变更摘要 +24 −3</text>
  <!-- composer (conversation) -->
  <rect x="258" y="458" width="264" height="80" rx="9" fill="#090909" stroke="#2a7deb" stroke-opacity="0.7"/>
  <text x="272" y="478" fill="#6b6c70" font-size="11">输入框 · conversation</text>
  <rect x="272" y="488" width="108" height="18" rx="5" fill="#2a7deb" fill-opacity="0.2"/>
  <text x="280" y="501" fill="#9ec4ff" font-size="10">composer.addons</text>
  <rect x="386" y="488" width="72" height="18" rx="5" fill="#ffffff" fill-opacity="0.05"/>
  <text x="396" y="501" fill="#909192" font-size="10">/ 斜杠命令</text>
  <text x="272" y="526" fill="#6b6c70" font-size="10">模型 · 思考等级 · 发送</text>

  <!-- editor island (files) -->
  <rect x="548" y="156" width="150" height="398" rx="10" fill="#2a7deb" fill-opacity="0.09" stroke="#2a7deb" stroke-opacity="0.6"/>
  <text x="562" y="178" fill="#9ec4ff" font-size="11" font-weight="650">编辑器 · ContentStage</text>
  <text x="562" y="196" fill="#6b6c70" font-size="10">文件插件 · files</text>
  <rect x="562" y="208" width="58" height="18" rx="4" fill="#2a7deb" fill-opacity="0.3"/>
  <text x="570" y="221" fill="#e0e1e4" font-size="10">main.ts</text>
  <rect x="624" y="208" width="60" height="18" rx="4" fill="#ffffff" fill-opacity="0.05"/>
  <text x="632" y="221" fill="#909192" font-size="10">Shell.vue</text>
  <text x="566" y="250" fill="#6b6c70" font-size="10" font-family="JetBrains Mono, Consolas, monospace">1 import</text>
  <text x="566" y="266" fill="#6b6c70" font-size="10" font-family="JetBrains Mono, Consolas, monospace">2   Shell</text>
  <text x="566" y="282" fill="#6b6c70" font-size="10" font-family="JetBrains Mono, Consolas, monospace">3 import</text>
  <text x="566" y="298" fill="#6b6c70" font-size="10" font-family="JetBrains Mono, Consolas, monospace">4   kernel</text>
  <text x="562" y="534" fill="#6b6c70" font-size="10">多标签 · 可关闭</text>

  <!-- panel island (changes) -->
  <rect x="710" y="156" width="154" height="398" rx="10" fill="#3fc28f" fill-opacity="0.09" stroke="#3fc28f" stroke-opacity="0.6"/>
  <text x="724" y="178" fill="#8fe0c0" font-size="11" font-weight="650">扩展面板 · RightPanel</text>
  <text x="724" y="196" fill="#6b6c70" font-size="10">变更插件 · changes</text>
  <text x="724" y="222" fill="#e0e1e4" font-size="11">Shell.vue</text>
  <text x="724" y="238" fill="#5fd3a5" font-size="10">+18  −2</text>
  <text x="724" y="260" fill="#e0e1e4" font-size="11">workbench.ts</text>
  <text x="724" y="276" fill="#5fd3a5" font-size="10">+6</text>
  <rect x="722" y="294" width="130" height="46" rx="6" fill="#df8538" fill-opacity="0.14" stroke="#df8538" stroke-opacity="0.5" stroke-dasharray="3 2"/>
  <text x="732" y="312" fill="#f0b27a" font-size="10">直接引用</text>
  <text x="732" y="328" fill="#6b6c70" font-size="10">components/shared/DiffView</text>
  <text x="724" y="534" fill="#6b6c70" font-size="10">变更摘要由 AgentChat 读取</text>

  <!-- caption under window -->
  <text x="56" y="592" fill="#6b6c70" font-size="11">窗口骨架是 Shell.vue：它组合固定组件与插件面板。插件通过内核上下文接入事件、命令、工作区和舞台，停用时执行清理并关闭所属面板。</text>

  <!-- ===================== layer stack ===================== -->
  <text x="916" y="122" fill="#e0e1e4" font-size="14" font-weight="650">纵向四层 · 依赖只往下</text>

  <rect x="916" y="140" width="364" height="62" rx="9" fill="#1f2023" stroke="#2a7deb" stroke-opacity="0.7"/>
  <text x="932" y="164" fill="#9ec4ff" font-size="13" font-weight="650">组合根 · main.ts</text>
  <text x="932" y="184" fill="#909192" font-size="11">唯一知道“有哪些插件”的地方，创建内核并注册</text>

  <rect x="916" y="226" width="364" height="62" rx="9" fill="#1f2023" stroke="#393b40"/>
  <text x="932" y="250" fill="#e0e1e4" font-size="13" font-weight="650">骨架 · shell/Shell.vue</text>
  <text x="932" y="270" fill="#909192" font-size="11">组合固定组件与已启用插件面板，不承载业务状态</text>

  <rect x="916" y="312" width="364" height="78" rx="9" fill="#1f2023" stroke="#393b40"/>
  <text x="932" y="336" fill="#e0e1e4" font-size="13" font-weight="650">内核 · kernel/</text>
  <text x="932" y="356" fill="#909192" font-size="11">事件总线 · 插件上下文 · 生命周期</text>
  <text x="932" y="374" fill="#909192" font-size="11">工作区状态 · 消息折叠为块（transcript）</text>

  <rect x="916" y="414" width="364" height="62" rx="9" fill="#1f2023" stroke="#393b40"/>
  <text x="932" y="438" fill="#e0e1e4" font-size="13" font-weight="650">宿主 · electron/</text>
  <text x="932" y="458" fill="#909192" font-size="11">窗口 · IPC · 每工作区的 Pi Worker 池</text>

  <!-- arrows between layers -->
  <line x1="1098" y1="202" x2="1098" y2="226" stroke="#6b6c70" marker-end="url(#arrow)"/>
  <line x1="1098" y1="288" x2="1098" y2="312" stroke="#6b6c70" marker-end="url(#arrow)"/>
  <line x1="1098" y1="390" x2="1098" y2="414" stroke="#6b6c70" marker-end="url(#arrow)"/>

  <!-- process boundary callout -->
  <rect x="916" y="492" width="364" height="58" rx="9" fill="#e5534b" fill-opacity="0.08" stroke="#e5534b" stroke-opacity="0.55"/>
  <text x="932" y="514" fill="#f08b84" font-size="12" font-weight="650">进程边界 · contextBridge</text>
  <text x="932" y="534" fill="#909192" font-size="11">前端与宿主只共享 window.piDesktop 清单，传 JSON</text>

  <!-- ===================== bottom: plugin areas and lifecycle ===================== -->
  <text x="40" y="640" fill="#e0e1e4" font-size="14" font-weight="650">插件区域 · 插件通过内核上下文接入工作台</text>

  <!-- position type -->
  <rect x="40" y="658" width="620" height="150" rx="10" fill="#111214" stroke="#2a2b2f"/>
  <text x="56" y="682" fill="#e0e1e4" font-size="13" font-weight="650">插件区域 · 按 conversation / files / sidebar 归类</text>
  <text x="56" y="702" fill="#6b6c70" font-size="11">插件声明面板、详情视图或渲染能力，由 Shell 与组件组合显示</text>
  <g font-size="11">
    <rect x="56" y="716" width="112" height="22" rx="5" fill="#e5a23d" fill-opacity="0.16" stroke="#e5a23d" stroke-opacity="0.5"/><text x="66" y="731" fill="#f0c27a">sidebar 面板</text>
    <rect x="176" y="716" width="100" height="22" rx="5" fill="#2a7deb" fill-opacity="0.16" stroke="#2a7deb" stroke-opacity="0.5"/><text x="186" y="731" fill="#9ec4ff">对话组件</text>
    <rect x="284" y="716" width="110" height="22" rx="5" fill="#2a7deb" fill-opacity="0.16" stroke="#2a7deb" stroke-opacity="0.5"/><text x="294" y="731" fill="#9ec4ff">编辑器舞台</text>
    <rect x="402" y="716" width="104" height="22" rx="5" fill="#3fc28f" fill-opacity="0.16" stroke="#3fc28f" stroke-opacity="0.5"/><text x="412" y="731" fill="#8fe0c0">右侧面板</text>
    <rect x="514" y="716" width="126" height="22" rx="5" fill="#3fc28f" fill-opacity="0.16" stroke="#3fc28f" stroke-opacity="0.5"/><text x="524" y="731" fill="#8fe0c0">变更摘要</text>

    <rect x="56" y="746" width="84" height="22" rx="5" fill="#2a7deb" fill-opacity="0.16" stroke="#2a7deb" stroke-opacity="0.5"/><text x="66" y="761" fill="#9ec4ff">标题栏</text>
    <rect x="148" y="746" width="92" height="22" rx="5" fill="#169068" fill-opacity="0.16" stroke="#169068" stroke-opacity="0.5"/><text x="158" y="761" fill="#7ddec0">连接状态</text>
    <rect x="248" y="746" width="92" height="22" rx="5" fill="#909192" fill-opacity="0.16" stroke="#909192" stroke-opacity="0.5"/><text x="258" y="761" fill="#c8c9cc">活动栏</text>
    <rect x="348" y="746" width="136" height="22" rx="5" fill="#2a7deb" fill-opacity="0.16" stroke="#2a7deb" stroke-opacity="0.5"/><text x="358" y="761" fill="#9ec4ff">输入框扩展</text>
    <rect x="492" y="746" width="84" height="22" rx="5" fill="#909192" fill-opacity="0.16" stroke="#909192" stroke-opacity="0.5"/><text x="502" y="761" fill="#c8c9cc">弹层</text>

    <rect x="56" y="776" width="96" height="22" rx="5" fill="#909192" fill-opacity="0.16" stroke="#909192" stroke-opacity="0.5"/><text x="66" y="791" fill="#c8c9cc">全局命令</text>
    <rect x="160" y="776" width="70" height="22" rx="5" fill="#909192" fill-opacity="0.16" stroke="#909192" stroke-opacity="0.5"/><text x="170" y="791" fill="#c8c9cc">斜杠命令</text>
    <rect x="238" y="776" width="76" height="22" rx="5" fill="#909192" fill-opacity="0.16" stroke="#909192" stroke-opacity="0.5"/><text x="248" y="791" fill="#c8c9cc">主题设置</text>
  </g>

  <!-- resolve type -->
  <rect x="676" y="658" width="604" height="150" rx="10" fill="#111214" stroke="#2a2b2f"/>
  <text x="692" y="682" fill="#e0e1e4" font-size="13" font-weight="650">插件生命周期 · 注册、启用、停用与清理</text>
  <text x="692" y="702" fill="#6b6c70" font-size="11">插件管理器负责状态持久化、订阅清理和面板 / 标签关闭</text>

  <text x="692" y="730" fill="#f0b27a" font-size="11">sidebar 插件</text>
  <rect x="796" y="714" width="150" height="22" rx="5" fill="#df8538" fill-opacity="0.2" stroke="#df8538" stroke-opacity="0.6"/><text x="806" y="729" fill="#f0b27a" font-size="11">files → 文件树</text>
  <rect x="954" y="714" width="150" height="22" rx="5" fill="#df8538" fill-opacity="0.12" stroke="#df8538" stroke-opacity="0.4"/><text x="964" y="729" fill="#909192" font-size="11">git → Git 树</text>
  <rect x="1112" y="714" width="150" height="22" rx="5" fill="#df8538" fill-opacity="0.12" stroke="#df8538" stroke-opacity="0.4"/><text x="1122" y="729" fill="#909192" font-size="11">events → RPC</text>

  <text x="692" y="766" fill="#c9b6f2" font-size="11">conversation / files 插件</text>
  <rect x="814" y="750" width="136" height="22" rx="5" fill="#a07be0" fill-opacity="0.2" stroke="#a07be0" stroke-opacity="0.6"/><text x="824" y="765" fill="#c9b6f2" font-size="11">markdown → 预览</text>
  <rect x="958" y="750" width="146" height="22" rx="5" fill="#a07be0" fill-opacity="0.12" stroke="#a07be0" stroke-opacity="0.4"/><text x="968" y="765" fill="#909192" font-size="11">mermaid → 图表</text>
  <rect x="1112" y="750" width="150" height="22" rx="5" fill="#a07be0" fill-opacity="0.12" stroke="#a07be0" stroke-opacity="0.4"/><text x="1122" y="765" fill="#909192" font-size="11">changes → 摘要</text>

  <text x="692" y="794" fill="#6b6c70" font-size="11">插件通过 context 订阅事件、注册命令，并在停用时撤销自己的资源。</text>

  <!-- legend -->
  <g font-size="11">
    <rect x="40" y="832" width="1240" height="44" rx="10" fill="#111214" stroke="#2a2b2f"/>
    <rect x="56" y="846" width="14" height="14" rx="3" fill="#2a7deb" fill-opacity="0.5"/><text x="78" y="858" fill="#909192">对话 conversation</text>
    <rect x="210" y="846" width="14" height="14" rx="3" fill="#e5a23d" fill-opacity="0.6"/><text x="232" y="858" fill="#909192">项目与会话</text>
    <rect x="330" y="846" width="14" height="14" rx="3" fill="#df8538" fill-opacity="0.6"/><text x="352" y="858" fill="#909192">工具卡片</text>
    <rect x="470" y="846" width="14" height="14" rx="3" fill="#a07be0" fill-opacity="0.6"/><text x="492" y="858" fill="#909192">消息与 Markdown</text>
    <rect x="640" y="846" width="14" height="14" rx="3" fill="#3fc28f" fill-opacity="0.6"/><text x="662" y="858" fill="#909192">文件变更</text>
    <rect x="780" y="846" width="14" height="14" rx="3" fill="#169068" fill-opacity="0.6"/><text x="802" y="858" fill="#909192">连接状态</text>
    <rect x="900" y="846" width="14" height="14" rx="3" fill="#909192" fill-opacity="0.5"/><text x="922" y="858" fill="#909192">其他插件</text>
    <text x="1030" y="858" fill="#6b6c70">虚线 = 组件间的直接引用</text>
  </g>
</svg>
